<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>接入 · Aide</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/connections.css">
<header><h1 class="brand"><img src="/icon.png" width="32" height="32" alt="">Aide</h1><span class="muted">选择 Aide 如何与你沟通。</span><nav class="main-tabs" aria-label="主导航"><a href="/">Topics</a><a href="/people">Persons</a><a href="/inputs">Inputs</a><a href="/connections" aria-current="page">接入</a></nav></header>
<main class="connections-page">
  <section aria-labelledby="channels-heading">
    <h2 id="channels-heading">沟通渠道</h2>
    <p>默认渠道用于 Aide 主动联系你。回复已有消息时，仍使用该消息所在的群聊或私聊。</p>
    <p id="channel-status" role="status" aria-live="polite"></p>
    <p id="channel-error" role="alert"></p>
    <div class="toolbar"><label>默认沟通渠道 <select id="default-channel"></select></label><button id="save-default" type="button">保存默认渠道</button><button id="refresh" type="button">刷新</button></div>
    <div id="channel-list"></div>
    <button id="add-channel" type="button">新增 Lark 渠道</button>
  </section>
  <section id="editor" aria-labelledby="editor-heading" hidden>
    <h2 id="editor-heading">新增渠道</h2>
    <form id="channel-form">
      <label>标识<input id="channel-id" required pattern="[a-zA-Z][a-zA-Z0-9_-]{0,63}" maxlength="64" placeholder="lark-work"></label>
      <label>名称<input id="channel-label" required maxlength="100" placeholder="飞书 · 工作账号"></label>
      <label><span><input id="channel-enabled" type="checkbox" checked>启用渠道</span></label>
      <label>Aide 应用 App ID<input id="channel-app" required pattern="cli_[a-zA-Z0-9]+" placeholder="cli_..."></label>
      <label>App Secret<input id="channel-secret" type="password" autocomplete="new-password" maxlength="1000"></label>
      <p class="muted">密钥仅写入服务器配置，不会返回页面。修改同一应用时留空保留；更换应用需重新填写。</p>
      <label>我在此应用下的身份（可选）<select id="known-me"><option value="">选择已知身份，或在下方填写</option></select><input id="channel-me" pattern="ou_[a-zA-Z0-9]+" placeholder="Me 的 open_id（ou_...）"></label>
      <p class="muted">Me 是可选身份标记，与机器人凭证独立。默认联系你时需要此身份，无需先发过私聊；其他应用的 open_id 不能直接复用。</p>
      <div class="toolbar"><button type="submit">保存</button><button id="cancel-edit" type="button">取消</button></div>
    </form>
  </section>
</main><script type="module" src="/connections.js"></script>
</html>
