<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outputs · Aide</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" type="image/vnd.microsoft.icon">
<link rel="stylesheet" href="/outputs.css">
<header><h1 class="brand"><img src="/icon.png" width="32" height="32" alt="">Aide</h1><span class="muted">查看生成内容与投递情况。</span><nav class="main-tabs" aria-label="主导航"><a href="/gate">Gate</a><a href="/inputs">Inputs</a><a href="/">Topics</a><a href="/people">Persons</a><a href="/addresses">Addresses</a><a href="/outputs" aria-current="page">Outputs</a></nav></header>
<main class="outputs-page">
  <form id="output-filters" role="search" aria-label="筛选 Output">
    <label class="output-search-label"><span class="filter-label">搜索</span><input id="output-search" type="search" maxlength="200" placeholder="正文或 Output ID"></label>
    <label><span class="filter-label">Topic</span><select id="output-topic"><option value="*">全部 Topic</option></select></label>
    <label><span class="filter-label">接收人</span><select id="output-receiver" title="匹配原定或实际接收人"><option value="*">全部接收人</option></select></label>
    <label><span class="filter-label">地址</span><select id="output-address" title="匹配原定或实际地址"><option value="*">全部地址</option></select></label>
    <label><span class="filter-label">投递状态</span><select id="output-phase"><option value="*">全部投递状态</option><option value="pending">待投递</option><option value="sending">投递中</option><option value="delivered">已送达</option><option value="failed">投递失败</option><option value="uncertain">投递待核对</option><option value="cancelled">已取消</option></select></label>
    <label><span class="filter-label">披露检查</span><select id="output-disclosure"><option value="*">全部披露结果</option><option value="pending">待检查</option><option value="allowed">允许</option><option value="denied">拒绝原内容外发</option></select></label>
    <label class="output-time-from"><span>创建时间起</span><input id="output-from" type="datetime-local"></label>
    <label class="output-time-to"><span>创建时间止</span><input id="output-to" type="datetime-local"></label>
    <div class="output-filter-actions"><button type="submit">筛选</button><button id="output-reset" class="secondary" type="button">重置</button></div>
  </form>
  <section class="outputs-catalog" aria-labelledby="outputs-heading">
    <div class="outputs-list-heading"><h2 id="outputs-heading">Outputs</h2><span id="output-count" class="muted" role="status" aria-live="polite"></span><button id="output-refresh" type="button" class="output-refresh" title="刷新 Outputs" aria-label="刷新 Outputs"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg></button></div>
    <nav id="output-list" aria-label="Output 列表"></nav>
    <p id="output-list-notice" role="status" aria-live="polite"></p>
    <div class="output-pagination" role="group" aria-label="Output 分页">
      <button id="output-previous" type="button" class="secondary">上一页</button><span id="output-page" class="muted"></span><button id="output-next" type="button" class="secondary">下一页</button>
    </div>
  </section>
  <section class="output-detail" aria-labelledby="output-heading">
    <h2 id="output-heading">选择一个 Output</h2>
    <p id="output-detail-notice" role="status" aria-live="polite">选择左侧记录，查看生成内容、披露检查与实际投递。</p>
    <div id="output-detail-content" hidden>
      <dl id="output-facts"></dl>
      <h3>生成内容</h3><details><summary>生成过程</summary><pre id="output-think"></pre></details><div id="output-text" class="output-text"></div>
      <h3>原定发送</h3><dl id="output-intent"></dl>
      <h3>披露检查</h3><dl id="output-check"></dl>
      <h3>实际投递</h3><dl id="output-delivery"></dl><div id="output-delivered-text" class="output-text" hidden></div>
      <details><summary>实际投递的过程</summary><pre id="output-delivered-think"></pre></details>
      <p class="muted">已送达不表示用户已读。这里只展示当前保留的状态，不是完整的逐次重试历史。</p>
      <h3>生成与材料关联</h3><dl id="output-provenance"></dl>
      <details><summary>引用的 Note 版本</summary><pre id="output-notes"></pre></details>
    </div>
  </section>
</main>
<script type="module" src="/outputs.js"></script>
</html>
