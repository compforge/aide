<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate · Aide</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" type="image/vnd.microsoft.icon">
<link rel="stylesheet" href="/gate.css">
<header><h1 class="brand"><img src="/icon.png" width="32" height="32" alt="">Aide</h1><span class="muted">把事情交给我，持续为你推进。</span><nav class="main-tabs" aria-label="主导航"><a href="/gate" aria-current="page">Gate</a><a href="/inputs">Inputs</a><a href="/">Topics</a><a href="/people">Persons</a><a href="/addresses">Addresses</a><a href="/outputs">Outputs</a><a href="/usage">Usage</a></nav><span id="connection" class="muted" aria-live="polite"></span></header>
<main class="gate-main">
  <section class="topic" aria-label="Gate">
    <div class="topic-header"><h2>Gate</h2></div>
    <details id="evidence" hidden><summary>引用的 Note</summary><div id="evidence-body" class="markdown"></div></details>
    <div id="topic-tabs" class="detail-tabs" role="tablist" aria-label="Gate 内容">
      <button id="tab-dialogue" type="button" role="tab" aria-controls="panel-dialogue" aria-selected="true">对话</button>
      <button id="tab-notes" type="button" role="tab" aria-controls="panel-notes" aria-selected="false" tabindex="-1">Note</button>
      <button id="tab-work" type="button" role="tab" aria-controls="panel-work" aria-selected="false" tabindex="-1">Work</button>
    </div>
    <div id="poll-notice" role="status"></div>
    <div id="approvals" aria-label="等待你处理的执行请求" aria-live="polite"></div>
    <p id="work-notice" role="status" class="muted"></p>
    <div id="panel-dialogue" class="topic-panel dialogue-panel" role="tabpanel" aria-labelledby="tab-dialogue">
      <div class="dialogue-main">
      <div id="messages" tabindex="0" role="log" aria-label="消息记录"><div class="history-loading"><span id="history-notice" class="muted" role="status"></span><button id="history-retry" type="button" hidden>重试加载</button></div><div id="history"></div><section id="activity" aria-label="Aide 执行进展" hidden></section></div>
      <form id="composer"><textarea id="input" aria-label="向 Aide 提问或交代事情" placeholder="向 Aide 提问或交代事情…" maxlength="32000" required disabled></textarea><button id="send" type="submit" disabled>发送</button></form>
      <div id="notice" role="status">正在连接 Gate…</div>
      </div>
    </div>
    <section id="panel-notes" class="topic-panel" role="tabpanel" aria-labelledby="tab-notes" tabindex="0" hidden>
      <div class="gate-filters"><label>Nature <select name="nature"><option value="">全部</option><option>semantic</option><option>procedural</option><option value="unclassified">未分类</option></select></label></div>
      <p id="notes-notice" class="muted" role="status"></p>
      <div id="notes-list"></div>
      <nav id="notes-pages" class="gate-pages" hidden aria-label="notes 分页"><button id="notes-prev" type="button">上一页</button> <span id="notes-page"></span> <button id="notes-next" type="button">下一页</button></nav>
    </section>
    <section id="panel-work" class="topic-panel" role="tabpanel" aria-labelledby="tab-work" tabindex="0" hidden>
      <div class="gate-filters"><label>类型 <select name="kind"><option value="">全部</option><option value="ongoing">Ongoing</option><option value="task">Task</option><option value="routine">Routine</option></select></label>
        <label>状态 <select name="state"><option value="active">进行中</option><option value="ended">已结束</option><option value="all">全部</option></select></label></div>
      <p id="work-notice" class="muted" role="status"></p>
      <p id="ongoing-supplement-result" class="muted" role="status"></p>
      <div id="work-list"></div>
      <nav id="work-pages" class="gate-pages" hidden aria-label="work 分页"><button id="work-prev" type="button">上一页</button> <span id="work-page"></span> <button id="work-next" type="button">下一页</button></nav>
    </section>
  </section>
</main>
<dialog id="ongoing-supplement" aria-labelledby="ongoing-supplement-heading" aria-describedby="ongoing-supplement-title">
  <form id="ongoing-supplement-form">
    <h2 id="ongoing-supplement-heading">补充跟进信息</h2>
    <p id="ongoing-supplement-title"></p>
    <label for="ongoing-supplement-text">进展或结论</label>
    <textarea id="ongoing-supplement-text" rows="5" maxlength="32000" required autofocus></textarea>
    <p id="ongoing-supplement-notice" role="status"></p>
    <div class="ongoing-supplement-actions">
      <button id="ongoing-supplement-cancel" type="button">取消</button>
      <button id="ongoing-supplement-submit" type="submit">提交</button>
    </div>
  </form>
</dialog>
<script type="module" src="/gate.js"></script>
</html>
