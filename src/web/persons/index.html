<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persons · Aide</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" type="image/vnd.microsoft.icon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/persons.css">
<header><h1 class="brand"><img src="/icon.png" width="32" height="32" alt="">Aide</h1><span class="muted">持续理解你和你身边的人。</span><nav class="main-tabs" aria-label="主导航"><a href="/">Topics</a><a href="/people" aria-current="page">Persons</a><a href="/inputs">Inputs</a><a href="/connections">接入</a></nav></header>
<main class="persons-page">
  <nav class="person-list" aria-label="人物列表"><h2 class="list-heading">人物<span id="person-count" class="muted" aria-label="人物总数"></span></h2><input id="person-search" type="search" placeholder="搜索人物" aria-label="搜索人物"><div id="person-list"></div>
    <div id="person-pagination" class="person-pagination" role="group" aria-label="人物分页" hidden>
      <button id="person-previous" class="secondary" type="button">上一页</button><span id="person-page" class="muted" aria-live="polite"></span><button id="person-next" class="secondary" type="button">下一页</button>
    </div>
    <p id="person-list-notice" role="status" class="muted"></p></nav>
  <section class="person-detail" aria-label="人物详情">
    <div class="person-title"><h2 id="person-heading">选择一个人物</h2><button id="person-name-edit" class="person-edit-icon" type="button" title="编辑姓名或称呼" aria-label="编辑姓名或称呼" aria-controls="person-name-form" aria-expanded="false" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7"/><path d="m16 3 5 5M10 14l-1 4 4-1 9-9a3.5 3.5 0 0 0-5-5z"/></svg></button></div><p id="person-empty" class="muted">随着消息和观察积累，Aide 会在这里记录认识的人。</p>
    <div id="person-editor" hidden>
      <form id="person-name-form" hidden>
      <label>姓名或称呼<input id="person-name" required maxlength="200"></label>
      <div class="person-actions"><button id="person-name-cancel" class="secondary" type="button">取消</button><button id="person-name-save" type="submit">保存称呼</button></div>
      </form>
      <div id="person-tabs" class="detail-tabs" role="tablist" aria-label="人物内容">
        <button id="person-tab-summary" type="button" role="tab" aria-selected="true" aria-controls="person-panel-summary">认识</button>
        <button id="person-tab-notes" type="button" role="tab" aria-selected="false" aria-controls="person-panel-notes" tabindex="-1">相关记录</button>
        <button id="person-tab-identities" type="button" role="tab" aria-selected="false" aria-controls="person-panel-identities" tabindex="-1">身份</button>
      </div>
      <section id="person-panel-summary" class="person-panel" role="tabpanel" aria-labelledby="person-tab-summary" tabindex="0">
      <section class="person-summary" aria-labelledby="person-summary-heading">
        <div class="person-summary-heading"><h3 id="person-summary-heading">当前认识</h3><button id="person-summary-edit" class="person-edit-icon" type="button" title="编辑当前认识" aria-label="编辑当前认识" aria-controls="person-summary-editor" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7"/><path d="m16 3 5 5M10 14l-1 4 4-1 9-9a3.5 3.5 0 0 0-5-5z"/></svg></button></div>
        <div id="person-summary-read" class="markdown"></div>
        <div id="person-summary-editor" hidden>
          <textarea id="person-summary" aria-labelledby="person-summary-heading" maxlength="16000" rows="8" placeholder="观点、偏好、关注、目标，以及与我的关系。"></textarea>
          <div class="person-summary-actions"><button id="person-summary-cancel" type="button" class="secondary">取消</button><button id="person-summary-confirm" type="button">确认</button></div>
        </div>
        <p id="person-summary-notice" role="status" aria-live="polite"></p>
      </section>
      <p id="person-updated" class="muted"></p>
      </section>
      <section id="person-panel-notes" class="person-panel" role="tabpanel" aria-labelledby="person-tab-notes" tabindex="0" hidden>
        <button id="person-notes-refresh" type="button" class="secondary">刷新记录</button>
        <div id="person-notes"></div>
        <p id="person-notes-notice" role="status" aria-live="polite" class="muted"></p>
        <button id="person-notes-more" type="button" class="secondary" hidden>加载更多</button>
      </section>
      <section id="person-panel-identities" class="person-panel" role="tabpanel" aria-labelledby="person-tab-identities" tabindex="0" hidden>
      <form id="person-identities-form">
      <fieldset><legend>外部身份</legend><p class="muted">同一个人可以有多个身份。Lark 使用 app ID 作为作用域、open ID 作为身份 ID；姓名不用于身份匹配。</p><div id="person-identities"></div><button id="identity-add" type="button" class="secondary">添加身份</button></fieldset>
      <label for="person-clearance">可接收密级</label><select id="person-clearance"><option value="L1">L1</option><option value="L2">L2</option><option value="L3">L3</option></select>
      <div class="person-actions"><button id="person-save" type="submit">保存身份与权限</button></div>
      </form>
    <section id="person-same-names" aria-labelledby="person-same-names-heading" hidden>
      <h3 id="person-same-names-heading">同名人物</h3>
      <p class="muted">姓名相同不代表同一个人，请核对外部身份后合并。</p>
      <div id="person-same-name-list"></div>
    </section>
      </section>
      <button id="person-reload" class="secondary person-reload" type="button">重新加载</button>
    </div>
    <p id="person-notice" role="status" aria-live="polite"></p>
  </section>
</main>
<dialog id="person-merge-dialog" aria-labelledby="person-merge-heading" aria-describedby="person-merge-warning">
  <form id="person-merge-form">
    <h2 id="person-merge-heading">确认合并人物</h2>
    <p id="person-merge-warning">确认是同一个人后，将身份和依据追加到当前人物，并删除被合并人物。历史消息保持不变。</p>
    <div class="person-merge-comparison">
      <section><h3>被合并人物（将删除）</h3><div id="person-merge-source"></div></section>
      <section><h3>当前人物（保留）</h3><div id="person-merge-target"></div></section>
    </div>
    <label for="person-merge-summary">合并后的当前认识（可编辑，最多 16000 字符）</label>
    <textarea id="person-merge-summary" rows="8"></textarea>
    <p id="person-merge-notice" role="status" aria-live="polite"></p>
    <div class="person-summary-actions"><button id="person-merge-cancel" type="button" class="secondary" autofocus>取消</button><button id="person-merge-confirm" type="submit">确认是同一人并合并</button></div>
  </form>
</dialog>
<script type="module" src="/persons.js"></script>
</html>
