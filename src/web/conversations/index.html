<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aide</title>
<link rel="icon" href="/favicon.ico" sizes="32x32" type="image/vnd.microsoft.icon">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/app.css">
<header><h1 class="brand"><img src="/icon.png" width="32" height="32" alt="">Aide</h1><span class="muted">把事情交给我，持续为你推进。</span><nav class="main-tabs" aria-label="主导航"><a href="/" aria-current="page">Conversations</a><a href="/people">Persons</a></nav><span id="connection" class="muted" aria-live="polite">连接中</span></header>
<main>
  <nav class="conversations" aria-label="会话列表">
    <h2>会话</h2>
    <div class="conversation-row">
      <button id="new-conversation" class="conversation-new" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7"/><path d="m16 3 5 5M10 14l-1 4 4-1 9-9a3.5 3.5 0 0 0-5-5z"/></svg>
        <span>新聊天</span>
      </button>
    </div>
    <div id="conversation-list"></div>
    <div id="conversation-pagination" class="conversation-pagination" role="group" aria-label="会话分页" hidden>
      <button id="conversation-previous" type="button" aria-label="上一页会话">上一页</button>
      <span id="conversation-page" class="muted" role="status"></span>
      <button id="conversation-next" type="button" aria-label="下一页会话">下一页</button>
    </div>
    <div id="conversation-notice" class="muted" role="status"></div>
  </nav>
  <section class="conversation" aria-label="对话">
    <div class="conversation-header">
      <h2 id="conversation-heading">选择一个会话</h2>
      <span id="conversation-copy"></span>
    </div>
    <div id="messages" role="log" aria-label="消息记录"><div id="history"></div><section id="activity" aria-label="Aide 执行进展" hidden></section></div>
    <div id="poll-notice" role="status"></div>
    <div id="approvals" aria-label="等待你处理的执行请求" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" aria-label="交办事情或回答问题" placeholder="交办一件事，或者告诉我你想长期关注什么…" maxlength="32000" required></textarea>
      <button id="send" type="submit">发送</button>
    </form>
    <div id="notice" role="status">Enter 发送 · Shift + Enter 换行</div>
  </section>
  <aside>
    <p id="work-notice" role="status" class="muted"></p>
    <section class="work-group" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">事项 <span id="task-count" class="muted">0</span></h2>
      <div id="tasks"></div>
    </section>
    <section class="work-group" aria-labelledby="routines-heading">
      <h2 id="routines-heading">安排 <span id="routine-count" class="muted">0</span></h2>
      <div id="routines"></div>
    </section>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</html>
