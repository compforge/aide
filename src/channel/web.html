<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aide · 个人助手</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20342b; background: #f5f5ef; }
  * { box-sizing: border-box; } body { margin: 0; }
  header { padding: 20px 32px; border-bottom: 1px solid #d8dfd5; display: flex; align-items: center; gap: 18px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.8px; } .muted { color: #68776c; font-size: 13px; }
  main { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 230px minmax(0, 1fr) 290px; height: calc(100dvh - 70px); }
  .conversation { min-width: 0; padding: 24px; min-height: 0; display: flex; flex-direction: column; }
  .conversations { padding: 24px 12px; border-right: 1px solid #d8dfd5; overflow: auto; }
  .conversations h2 { font-size: 16px; margin: 0 10px 18px; }
  .conversation-link { display: block; color: inherit; text-decoration: none; padding: 12px 10px; border-radius: 10px; margin-bottom: 6px; }
  .conversation-link:hover { background: #edf1e8; }
  .conversation-link[aria-current="page"] { background: #dfeadd; }
  .conversation-link:focus-visible { outline: 3px solid #83a38b; outline-offset: -3px; }
  .conversation-link strong, .conversation-link span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conversation-link strong { font-size: 14px; margin-bottom: 6px; }
  .conversation-link span { margin-top: 4px; }
  #conversation-notice { margin: 10px; color: #9b5b11; }
  #conversation-heading { font-size: 16px; margin: 0 0 6px; overflow-wrap: anywhere; }
  #conversation-id { overflow-wrap: anywhere; margin-bottom: 12px; }
  #messages { flex: 1; overflow: auto; padding: 0 12px 24px 0; }
  .message { padding: 16px 18px; background: white; border: 1px solid #e1e6dc; border-radius: 12px; margin: 12px 0; }
  .message.user { background: #e8eee3; margin-left: 10%; }
  .message p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; line-height: 1.65; }
  #activity { margin: 12px 0; padding: 16px 18px; border: 1px solid #cbd9cc; border-radius: 12px; background: #f0f5ed; }
  #activity[hidden] { display: none; }
  .activity-heading { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #42634c; }
  .activity-heading::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #64886b; animation: pulse 1.4s ease-in-out infinite; }
  .activity-block { margin-top: 12px; font-size: 13px; }
  .activity-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; margin: 6px 0; }
  .activity-block.thought .activity-content, .activity-block.tool .activity-content { max-height: 220px; overflow: auto; color: #68776c; }
  .activity-block summary { cursor: pointer; }
  .execution-history { margin: 12px 0; padding: 12px 18px; border: 1px solid #e1e6dc; border-radius: 12px; }
  .execution-history > summary { cursor: pointer; color: #68776c; font-size: 13px; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media(prefers-reduced-motion: reduce) { .activity-heading::before { animation: none; } }
  .empty { margin: 10vh auto; max-width: 480px; } .empty h2 { font-size: 26px; font-weight: 500; }
  .empty p { line-height: 1.8; color: #68776c; } form { display: flex; align-items: end; gap: 12px; }
  textarea { width: 100%; resize: vertical; min-height: 80px; max-height: 200px; border: 1px solid #bdcbbb; border-radius: 12px; padding: 14px; font: inherit; background: white; }
  button { border: 0; border-radius: 10px; padding: 13px 20px; background: #294f3a; color: white; font: inherit; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: wait; } button:focus-visible, textarea:focus-visible { outline: 3px solid #83a38b; outline-offset: 2px; }
  #notice { min-height: 22px; margin-top: 10px; font-size: 13px; color: #68776c; } #notice.error { color: #a0362a; }
  aside { padding: 24px 20px; border-left: 1px solid #d8dfd5; overflow: auto; } aside h2 { font-size: 16px; margin: 0 0 18px; }
  .work-group + .work-group { margin-top: 28px; padding-top: 24px; border-top: 1px solid #d8dfd5; }
  .work { background: white; border-radius: 10px; border: 1px solid #e1e6dc; padding: 14px; margin-bottom: 12px; }
  .work strong { display: block; margin: 8px 0; font-size: 14px; overflow-wrap: anywhere; }
  .work p { font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .badge { display: inline-block; padding: 3px 7px; background: #edf1e8; border-radius: 5px; font-size: 11px; }
  .waiting, .uncertain, .invalid_result { color: #9b5b11; background: #fff1d9; } .running { background: #dceee1; }
  details { font-size: 12px; color: #68776c; margin-top: 8px; }
  #poll-notice { color: #9b5b11; font-size: 13px; }
  #poll-notice:not(:empty) { margin-bottom: 12px; }
  #interactions { max-height: 45vh; overflow: auto; }
  .interaction { border: 1px solid #cfac72; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff8e9; }
  .interaction p, .interaction pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  @media(max-width: 1000px) { header { padding: 16px; } main { display: block; height: auto; } .conversations { max-height: 220px; border-right: 0; border-bottom: 1px solid #d8dfd5; padding: 16px; } .conversation { height: 75dvh; padding: 16px; } aside { border-left: 0; border-top: 1px solid #d8dfd5; } }
</style>
<header><h1>Aide</h1><span class="muted">把事情交给我，持续为你推进。</span><span id="connection" class="muted" style="margin-left:auto" aria-live="polite">连接中</span></header>
<main>
  <nav class="conversations" aria-label="会话列表">
    <h2>会话</h2>
    <div id="conversation-list"></div>
    <div id="conversation-notice" class="muted" role="status"></div>
  </nav>
  <section class="conversation" aria-label="对话">
    <h2 id="conversation-heading">默认对话</h2>
    <div id="conversation-id" class="muted"></div>
    <div id="messages" role="log" aria-label="消息记录"><div id="history"></div><section id="activity" aria-label="Aide 执行进展" hidden></section></div>
    <div id="poll-notice" role="status"></div>
    <div id="interactions" aria-label="等待你处理的执行请求" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" aria-label="交办事情或回答问题" placeholder="交办一件事，或者告诉我你想长期关注什么…" maxlength="32000" required></textarea>
      <button id="send" type="submit">发送</button>
    </form>
    <div id="notice" role="status">Enter 发送 · Shift + Enter 换行</div>
  </section>
  <aside>
    <section class="work-group" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">事项 <span id="task-count" class="muted">0</span></h2>
      <div id="tasks"></div>
    </section>
    <section class="work-group" aria-labelledby="routines-heading">
      <h2 id="routines-heading">安排 <span id="routine-count" class="muted">0</span></h2>
      <div id="routines"></div>
    </section>
  </aside>
</main>
<script type="module">
  import { applyPatch, parsePatchEvent } from '/agentue.js';
  const $ = (id) => document.getElementById(id);
  const conversationId = new URL(location.href).searchParams.get('conversation') || 'me';
  const query = '?conversationId=' + encodeURIComponent(conversationId);
  const labels = { ready: '准备执行', running: '执行中', waiting: '等你回答', scheduled: '等待触发', paused: '已暂停', done: '已完成', uncertain: '需要核对结果', invalid_result: '结果解析失败' };
  let lastMessages = '', lastWork = '', lastInteractions = '', polling = false, sending = false, draft = null;
  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  async function api(path, options) {
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '请求失败');
    return data;
  }
  let lastConversations = '';
  function renderConversations(conversations) {
    const items = [...conversations];
    for (const id of new Set([conversationId, 'me'])) {
      if (!items.some((item) => item.id === id)) items.push({ id, title: id === 'me' ? '默认对话' : id, preview: '' });
    }
    const current = items.find((item) => item.id === conversationId);
    $('conversation-heading').textContent = current.title;
    $('conversation-id').textContent = current.id;
    document.title = current.title + ' · Aide';
    const signature = JSON.stringify(items);
    if (signature === lastConversations) return;
    lastConversations = signature;
    const links = items.map((item) => {
      const link = element('a', undefined, 'conversation-link');
      const url = new URL(location.href); url.searchParams.set('conversation', item.id);
      link.href = url.href;
      if (item.id === conversationId) link.setAttribute('aria-current', 'page');
      link.title = item.title + ' · ' + item.id;
      link.append(element('strong', item.title), element('span', item.id, 'muted'));
      if (item.preview) link.append(element('span', item.preview, 'muted'));
      return link;
    });
    $('conversation-list').replaceChildren(...links);
  }
  async function refreshConversations() {
    try {
      renderConversations(await api('/conversations'));
      $('conversation-notice').textContent = '';
    } catch { $('conversation-notice').textContent = '会话列表暂时无法更新，正在重试。'; }
  }
  function renderMessages(blocks) {
    const liveIds = new Set(blocks.filter((block) => block.type === 'execution' && block.status === 'running').map((block) => block.id));
    const history = blocks.filter((block) => !liveIds.has(block.id) && !liveIds.has(block.parent_id));
    const signature = JSON.stringify(history);
    if (signature === lastMessages) return;
    lastMessages = signature;
    const nearBottom = $('messages').scrollHeight - $('messages').scrollTop - $('messages').clientHeight < 100;
    const expanded = new Map([...$('history').querySelectorAll('details')].map((node) => [node.dataset.blockId, node.open]));
    $('history').replaceChildren();
    if (!history.length) {
      const empty = element('div', undefined, 'empty');
      empty.append(element('h2', '从一件具体的事开始'), element('p', '例如：总结工作目录里的 README；每天上午检查项目进展；关注某件事，发生变化时告诉我。'));
      $('history').append(empty);
    }
    for (const block of history.filter((block) => !block.parent_id)) {
      if (block.type === 'message') {
        const node = element('article', undefined, 'message ' + block.role);
        node.append(element('div', (block.role === 'user' ? '你' : 'Aide') + ' · ' + new Date(block.at).toLocaleTimeString(), 'muted'), element('p', block.content));
        $('history').append(node);
      } else if (block.type === 'execution') {
        const node = element('details', undefined, 'execution-history'); node.dataset.blockId = block.id; node.open = expanded.get(block.id) ?? false;
        const status = block.status === 'completed' ? '已完成' : '已中断';
        node.append(element('summary', '查看思考与执行过程 · ' + status));
        for (const child of history.filter((child) => child.parent_id === block.id)) {
          const detail = progressNode(child.type); detail.dataset.blockId = child.id;
          if (child.type !== 'text') detail.open = expanded.get(child.id) ?? true;
          updateProgress(detail, child.type, child.content, child.status, child.detail);
          node.append(detail);
        }
        $('history').append(node);
      }
    }
    if (nearBottom) $('messages').scrollTop = $('messages').scrollHeight;
  }
  let activityId;
  const activityNodes = new Map();
  const toolLabels = { in_progress: '执行中', pending: '等待执行', completed: '已完成', failed: '失败', declined: '已拒绝' };
  function progressNode(kind) {
    const node = element(kind === 'text' ? 'div' : 'details', undefined, 'activity-block ' + kind);
    if (kind !== 'text') { node.open = true; node.append(element('summary')); }
    node.append(element('div', '', 'activity-content')); return node;
  }
  function updateProgress(node, kind, text, status, detail) {
    if (kind === 'thought') node.querySelector('summary').textContent = '思考过程';
    if (kind === 'tool') node.querySelector('summary').textContent = text + ' · ' + (toolLabels[status] || status || '状态未知');
    const content = node.querySelector('.activity-content');
    const value = kind === 'tool' ? detail || '' : text;
    if (content.textContent !== value) content.textContent = value;
  }
  function renderActivity(activity) {
    const area = $('activity');
    const nearBottom = $('messages').scrollHeight - $('messages').scrollTop - $('messages').clientHeight < 100;
    area.hidden = !activity;
    if (!activity) { area.replaceChildren(); activityNodes.clear(); activityId = undefined; return; }
    if (activity.id !== activityId) {
      activityId = activity.id; activityNodes.clear(); area.replaceChildren();
      const heading = element('div', '', 'activity-heading'); heading.id = 'activity-heading'; heading.setAttribute('role', 'status'); area.append(heading);
    }
    const last = activity.blocks.at(-1);
    const label = activity.phase === 'waiting' ? '等待你回答' : activity.phase === 'queued' ? '正在排队'
      : last?.kind === 'tool' && last.status === 'in_progress' ? '正在调用工具'
      : last?.kind === 'thought' ? '正在思考' : last?.kind === 'text' ? '正在回复' : '正在处理';
    $('activity-heading').textContent = label + '…' + (activity.queued ? ` · ${activity.queued} 条待处理` : '');
    const ids = new Set(activity.blocks.map((block) => block.id));
    for (const [id, node] of activityNodes) if (!ids.has(id)) { node.remove(); activityNodes.delete(id); }
    for (const block of activity.blocks) {
      let node = activityNodes.get(block.id);
      if (!node) {
        node = progressNode(block.kind); activityNodes.set(block.id, node); area.append(node);
      }
      updateProgress(node, block.kind, block.text, block.status, block.detail);
    }
    if (nearBottom) $('messages').scrollTop = $('messages').scrollHeight;
  }
  function renderWork(works) {
    const signature = JSON.stringify(works);
    if (signature === lastWork) return;
    lastWork = signature;
    renderWorkGroup(works.filter((work) => work.kind === 'task'), 'tasks', 'task-count', '还没有事项，交办一件事试试。');
    renderWorkGroup(works.filter((work) => work.kind === 'routine'), 'routines', 'routine-count', '还没有安排，可以告诉我想定期处理或长期关注什么。');
  }
  function renderWorkGroup(works, listId, countId, emptyText) {
    $(countId).textContent = works.length;
    const list = $(listId);
    list.replaceChildren();
    if (!works.length) list.append(element('p', emptyText, 'muted'));
    for (const work of [...works].reverse()) {
      const node = element('article', undefined, 'work');
      node.append(element('span', labels[work.status], 'badge ' + work.status), element('strong', work.title));
      if (work.question) node.append(element('p', work.question));
      if (work.status === 'uncertain') node.append(element('p', '执行中断或失败。请核对外部结果，再发消息决定是否继续。'));
      if (work.status === 'invalid_result') node.append(element('p', '执行已结束，但最终结果解析失败。请核对执行记录，再决定是否继续。'));
      if (work.nextAt) node.append(element('p', '下次：' + new Date(work.nextAt).toLocaleString(), 'muted'));
      const detail = element('details');
      detail.append(element('summary', '查看目标与进展'), element('p', work.instruction));
      const latest = [...work.history].reverse().find((entry) => entry.role === 'aide');
      if (latest) detail.append(element('p', latest.text));
      node.append(detail); list.append(node);
    }
  }
  function renderInteractions(interactions) {
    const signature = JSON.stringify(interactions);
    if (signature === lastInteractions) return;
    lastInteractions = signature;
    $('interactions').replaceChildren();
    for (const item of interactions) {
      const request = item.request;
      const node = element('article', undefined, 'interaction');
      const actions = element('div', undefined, 'actions');
      const status = element('p', '', 'muted');
      function action(label, result) {
        const button = element('button', label);
        button.type = 'button';
        button.addEventListener('click', async () => {
          actions.querySelectorAll('button').forEach((button) => button.disabled = true);
          try {
            await api('/interactions', { method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ messageId: item.messageId, result: typeof result === 'function' ? result() : result }) });
            node.remove();
            await poll();
          } catch (error) {
            status.textContent = error.message;
            actions.querySelectorAll('button').forEach((button) => button.disabled = false);
          }
        });
        actions.append(button);
      }
      if (request.kind === 'hook_trust') {
        node.append(element('strong', request.harnessName + ' 等待确认启动 Hooks'),
          element('p', '以下 Hooks 尚未受信任或内容已变更。信任后，它们可以在对应的执行事件中运行。此决定作用于当前 Aide 实例。'));
        const details = element('details');
        details.append(element('summary', '查看 Hooks 的来源与执行命令'));
        for (const hook of request.hooks) details.append(element('pre',
          [hook.key + ' · ' + (hook.trustStatus === 'modified' ? '已变更' : '尚未信任'),
            hook.sourcePath, hook.command, hook.currentHash || ''].join('\n')));
        node.append(details);
        action('信任并继续', { kind: 'hook_trust', outcome: 'trusted' });
        action('不启用这些 Hooks，继续', { kind: 'hook_trust', outcome: 'skipped' });
      } else if (request.kind === 'permission') {
        node.append(element('strong', request.title));
        if (request.description) node.append(element('p', request.description));
        for (const option of request.options) action(option.name, { kind: 'permission', outcome: 'selected', optionId: option.optionId });
      } else if (request.kind === 'question') {
        const fields = [];
        for (const question of request.questions) {
          node.append(element('strong', question.header), element('p', question.question));
          if (request.questions.length === 1) {
            for (const choice of question.choices || []) action(choice.label,
              { kind: 'question', outcome: 'answered', answers: { [question.questionId]: [choice.value] } });
          }
          if (question.allowOther || !question.choices?.length) {
            const field = element('input'); field.placeholder = '输入答复'; node.append(field);
            fields.push({ id: question.questionId, field });
          }
        }
        if (fields.length === request.questions.length) action('提交答复', () => ({ kind: 'question', outcome: 'answered',
          answers: Object.fromEntries(fields.map(({ id, field }) => [id, [field.value]])) }));
      } else {
        node.append(element('strong', '执行正在等待用户回应'),
          element('p', '网页暂不支持此类回应，可以取消本次执行。'), element('pre', JSON.stringify(request, null, 2)));
      }
      action('取消执行', { kind: 'cancelled', reason: 'user' });
      node.append(actions, status);
      $('interactions').append(node);
    }
  }
  /** @spec 轮询故障和恢复仅更新轮询状态，不覆盖发送结果或实时连接状态。 */
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const [works, interactions] = await Promise.all([api('/work' + query), api('/interactions'), refreshConversations()]);
      renderWork(works); renderInteractions(interactions);
      $('poll-notice').textContent = '';
    } catch { $('poll-notice').textContent = '事项或交互暂时无法更新，正在重试。'; }
    finally { polling = false; }
  }
  $('composer').addEventListener('submit', async (event) => {
    event.preventDefault();
    const text = $('input').value.trim();
    if (!text || sending) return;
    sending = true; $('send').disabled = true; $('input').disabled = true;
    $('notice').className = ''; $('notice').textContent = '正在理解你的请求…';
    if (!draft || draft.text !== text) draft = { id: crypto.randomUUID(), conversationId, text };
    try {
      await api('/messages', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(draft) });
      draft = null; $('input').value = ''; $('notice').textContent = '已接收，后续进展会显示在这里。';
      await poll(); $('messages').scrollTop = $('messages').scrollHeight;
    } catch (error) { $('notice').className = 'error'; $('notice').textContent = error.message + ' 原消息编号会保留，避免重复交办。'; }
    finally { sending = false; $('send').disabled = false; $('input').disabled = false; $('input').focus(); }
  });
  $('input').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); $('composer').requestSubmit(); }
  });
  const stream = new EventSource('/stream' + query);
  let view = {};
  stream.onmessage = (event) => {
    try {
      const patch = parsePatchEvent(event.data);
      view = applyPatch(view, patch);
      if (patch.op === 'ping' || patch.op === 'end') return;
      renderMessages(view.blocks);
      const liveIds = new Set(view.blocks.filter((block) => block.type === 'execution' && block.status === 'running').map((block) => block.id));
      renderActivity(view.meta.activity && { ...view.meta.activity, blocks: view.blocks.filter((block) => liveIds.has(block.parent_id))
        .map((block) => ({ ...block, kind: block.type, text: block.content })) });
      $('connection').textContent = view.meta.error ? view.meta.error.message : '实时连接';
    } catch {
      stream.close(); $('connection').textContent = '无法读取对话进展，请刷新页面重试';
    }
  };
  stream.onopen = () => { $('connection').textContent = '实时连接'; };
  stream.onerror = () => { $('connection').textContent = '连接断开 · 正在重连'; };
  renderConversations([]);
  poll(); setInterval(poll, 1500);
</script>
</html>
