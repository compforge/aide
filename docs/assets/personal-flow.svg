<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="588" viewBox="0 0 1020 588" role="img" aria-labelledby="title desc">
  <title id="title">领域 Chief 的办理与沟通、认识与沉淀</title>
  <desc id="desc">领域 Input 归入 Topic 后，由 Chief 结合已有认识研判。Chief 可以直接答复，也可以通过 Task、Routine 或事项跟进继续处理，按需产生 Output。值得留存的信息形成普通 Note，由 aide:curate 梳理。aide:summary 复核对象的长期认识，按需更新 Summary Note。普通 Note 和 Summary 都为后续判断提供依据。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#536773"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #233543; }
      .node { font-size: 21px; font-weight: 600; }
      .detail { font-size: 16px; fill: #465c68; }
      .heading { font-size: 22px; font-weight: 600; }
      .box { stroke-width: 1.4; }
      .shared { fill: #eef2f6; stroke: #aebcc9; }
      .work { fill: #f0f5fb; stroke: #a4bdd3; }
      .note { fill: #edf6f0; stroke: #98bba6; }
      .line { fill: none; stroke: #536773; stroke-width: 1.8; marker-end: url(#arrow); }
      .return { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1020" height="588" fill="#fff"/>

  <g text-anchor="middle">
    <rect class="box shared" x="42" y="38" width="190" height="78" rx="10"/>
    <text class="node" x="137" y="70">Input</text>
    <text class="detail" x="137" y="96">消息、观察或交办</text>
    <path class="line" d="M234 77 H275"/>
    <rect class="box shared" x="280" y="38" width="210" height="78" rx="10"/>
    <text class="node" x="385" y="70">Topic 归属</text>
    <text class="detail" x="385" y="96">确定负责领域</text>
    <path class="line" d="M492 77 H535"/>
    <rect class="box shared" x="540" y="38" width="300" height="78" rx="10"/>
    <text class="node" x="690" y="70">领域 Chief</text>
    <text class="detail" x="690" y="96">结合新材料、已有认识与工作研判</text>
    <path class="line" d="M690 118 V143 H243 V173"/>
    <path class="line" d="M690 143 H685 V173"/>

    <text class="heading" x="243" y="205">办理与沟通</text>
    <text class="heading" x="685" y="205">认识与沉淀</text>

    <rect class="box work" x="32" y="225" width="422" height="80" rx="10"/>
    <text class="node" x="243" y="258">当轮响应 · System 1</text>
    <text class="detail" x="243" y="284">已有事实足够，直接答复或办妥</text>
    <rect class="box work" x="32" y="339" width="422" height="74" rx="10"/>
    <text class="node" x="243" y="369">后续处理 · System 2</text>
    <text class="detail" x="243" y="394">Task · Routine · Ongoing</text>
    <path class="line" d="M32 265 H15 V521 H29"/>
    <path class="line" d="M243 415 V476"/>
    <text class="detail" x="307" y="452">需要沟通时</text>
    <rect class="box work" x="32" y="481" width="422" height="80" rx="10"/>
    <text class="node" x="243" y="514">Output</text>
    <text class="detail" x="243" y="540">答复、结果、提醒或待决事项</text>

    <rect class="box note" x="500" y="225" width="370" height="80" rx="10"/>
    <text class="node" x="685" y="258">普通 Note</text>
    <text class="detail" x="685" y="284">按需记录具体事项、依据与未决问题</text>
    <path class="line" d="M685 307 V334"/>
    <rect class="box note" x="500" y="339" width="370" height="74" rx="10"/>
    <text class="node" x="685" y="369">aide:curate</text>
    <text class="detail" x="685" y="394">核实、归类并整理普通 Note</text>
    <path class="line" d="M685 415 V476"/>
    <text class="detail" x="766" y="452">按需提炼长期认识</text>
    <rect class="box note" x="500" y="481" width="370" height="80" rx="10"/>
    <text class="node" x="685" y="514">Summary Note</text>
    <text class="detail" x="685" y="540">aide:summary 复核对象的默认背景</text>
  </g>

  <path class="line return" d="M872 521 H944 V77 H846"/>
  <path d="M872 265 H944" fill="none" stroke="#536773" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text class="detail" text-anchor="middle" transform="translate(973 300) rotate(90)">已有认识供下一次判断使用</text>
</svg>
