<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Personal：输入、路由、研判、办理与输出</title>
<desc id="desc">Channel 与 Source 提交 Input。Route 规则或持续 Route Agent 写入路由与研判分派，Conversation 的 Chief 研判并按需交给 Task 或 Routine。Chief 和 Work Agent 经 say 创建独立 Output，由 Channel 或 Connector 投递。Person 提供人物身份与认识；Input 保存 route、assess、handle 处理痕迹，Harness 自持原生会话。</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#586779" stroke-width="1.5"/></marker>
 <style>
 text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#293746;text-anchor:middle;font-size:24px}
 .title{font-size:32px;font-weight:600}.small{font-size:19px;fill:#526579}.box{stroke:#8b9bae;stroke-width:2;rx:16}
 .line{fill:none;stroke:#586779;stroke-width:2.5;marker-end:url(#arrow)}.hint{fill:none;stroke:#ae7e8c;stroke-width:2;stroke-dasharray:8 7}
 </style>
</defs>
<rect width="1600" height="900" fill="#fafbf9"/>
<text class="title" x="800" y="52">把大量输入转为判断、行动与值得关注的输出</text>
<rect class="box" x="620" y="90" width="420" height="95" fill="#f5e9ed"/>
<text x="830" y="127">Person · 人物身份与认识</text><text class="small" x="830" y="162">Me 是可选标记 · summary + recent</text>
<path class="hint" d="M620 137 H150 V280 M830 185 V280 M1040 137 H1510 V575 H1000"/>
<text class="small" x="336" y="126">Input.sender</text><text class="small" x="1300" y="126">Output.receivers</text>
<text x="155" y="226">Channel / Source</text><path class="line" d="M155 238 V275"/>
<rect class="box" x="40" y="285" width="230" height="150" fill="#e6eef8"/>
<text x="155" y="328">Input</text><text class="small" x="155" y="368">内容 · 人物 · 地址</text><text class="small" x="155" y="402">话题线索 · 紧迫性</text>
<path class="line" d="M270 355 H330"/>
<rect class="box" x="340" y="285" width="270" height="150" fill="#eef1e2"/>
<text x="475" y="328">Route</text><text class="small" x="475" y="368">确定性规则 / Route Agent</text><text class="small" x="475" y="402">无合适归属 → Default</text>
<path class="line" d="M610 355 H670"/>
<rect class="box" x="680" y="285" width="320" height="150" fill="#e5f0e7"/>
<text x="840" y="328">Conversation / Chief</text><text class="small" x="840" y="368">话题 · 研判 · 直接处理</text><text class="small" x="840" y="402">summary + recent</text>
<path class="line" d="M1000 355 H1090"/>
<rect class="box" x="1100" y="285" width="360" height="150" fill="#e5f0e7"/>
<text x="1280" y="328">Task / Routine</text><text class="small" x="1280" y="368">有限目标 / 持续职责</text><text class="small" x="1280" y="402">专属 Agent · 独立生命周期</text>
<text class="small" x="475" y="476">route → assess 分派</text><text class="small" x="840" y="476">assess_input → handle 交接</text><text class="small" x="1280" y="476">report_task / report_routine</text>
<rect class="box" x="40" y="520" width="570" height="145" fill="#e6eef8"/>
<text x="325" y="560">Input.status：协作与追踪依据</text><text class="small" x="325" y="600">route → assess → handle[Work UID]</text><text class="small" x="325" y="636">各自确认 · 全部完成后才可回收</text>
<path class="line" d="M840 485 V530"/><text class="small" x="880" y="519">say</text>
<path class="line" d="M1280 490 V515 H1040 V600 H1008"/><text class="small" x="1170" y="507">say</text>
<rect class="box" x="680" y="540" width="320" height="125" fill="#f5eddf"/>
<text x="840" y="582">Output</text><text class="small" x="840" y="619">给谁 · 在哪里 · 说什么</text><text class="small" x="840" y="649">独立持久化与投递状态</text>
<path class="line" d="M1000 640 H1090"/>
<rect class="box" x="1100" y="555" width="360" height="110" fill="#f5eddf"/>
<text x="1280" y="596">Channel / Connector</text><text class="small" x="1280" y="636">按 Address 投递 · 保存回执</text>
<rect class="box" x="40" y="740" width="1420" height="105" fill="#eff0f4"/>
<text x="750" y="780">Reconcile：确定性协调　·　Agent：持续判断与执行</text>
<text class="small" x="750" y="817">Harness verb → 原生 create / resume / prompt / followUp / steer　｜　Harness 自持历史与恢复</text>
<text class="small" x="800" y="881">report 确认业务进展，say 创建表达；输入处理完成、目标达成和消息送达分别记录</text>
</svg>
