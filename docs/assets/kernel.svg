<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="990" viewBox="0 0 1500 990" role="img" aria-labelledby="title desc">
  <title id="title">Aide：由 Controller 的 Reconcile 驱动业务闭环</title>
  <desc id="desc">Channel 将人的消息写入内置 Conversation、Input 和 Message。Source 经 Connector 感知外部变化，提交 Input 或建立业务资源。资源变化通过队列和 Watch 唤醒 Controller。Controller 直接调用用户交互或 Connector，也可经 Harness 由 Agent 选择工具。Chief 的 Work 工具操作 Task 和 Routine，再由对应 Controller 推进。Chief、Task、Routine 是 Personal Plugin 的 Controller 示例。此图展示逻辑协作关系，不表示进程布局。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b68"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #203b37; }
      .title { font-size: 28px; font-weight: 650; }
      .heading { font-size: 24px; font-weight: 600; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #526864; }
      .box { stroke: #78948d; stroke-width: 2; rx: 18; }
      .flow { fill: none; stroke: #536b68; stroke-width: 2.5; marker-end: url(#arrow); stroke-linejoin: round; }
      .label { font-size: 18px; paint-order: stroke; stroke: #f8faf8; stroke-width: 7px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1500" height="990" fill="#f8faf8"/>
  <text x="40" y="52" class="title">Aide · Controller / Reconcile 协作模型</text>
  <text x="40" y="84" class="small">变化唤醒业务，资源保存进展，Reconcile 决定下一步</text>

  <rect x="430" y="150" width="630" height="230" class="box" fill="#e6eee9"/>
  <text x="455" y="190" class="heading">Plugin · 业务 Controller</text>
  <rect x="455" y="210" width="180" height="65" class="box" fill="#fff"/>
  <text x="545" y="250" text-anchor="middle" class="body">Chief</text>
  <rect x="650" y="210" width="180" height="65" class="box" fill="#fff"/>
  <text x="740" y="250" text-anchor="middle" class="body">Task / Routine</text>
  <rect x="845" y="210" width="190" height="65" class="box" fill="#fff"/>
  <text x="940" y="250" text-anchor="middle" class="body">其他 Controller</text>
  <text x="455" y="314" class="heading">Reconcile</text>
  <text x="455" y="348" class="body">读取事实 → 判断 → 执行动作 → 保存进展</text>

  <rect x="40" y="150" width="300" height="180" class="box" fill="#eef1e7"/>
  <text x="65" y="192" class="heading">Source · 发现变化</text>
  <text x="65" y="232" class="body">初始发现 / 订阅</text>
  <text x="65" y="266" class="body">业务观察可由 Controller</text>
  <text x="65" y="298" class="body">定时执行</text>

  <rect x="40" y="540" width="300" height="175" class="box" fill="#e8eff4"/>
  <text x="65" y="582" class="heading">Channel ↔ 用户</text>
  <text x="65" y="622" class="body">Web / Feishu</text>
  <text x="65" y="660" class="body">消息输入、答复与问题</text>
  <text x="65" y="692" class="body">思考 / 内容 / 执行进展</text>

  <rect x="430" y="520" width="630" height="300" class="box" fill="#e8eff4"/>
  <text x="455" y="562" class="heading">资源与调度 · Host 持有</text>
  <rect x="455" y="585" width="280" height="125" class="box" fill="#fff"/>
  <text x="475" y="620" class="body">内置对象的 Resource 投影</text>
  <text x="475" y="658" class="heading">Conversation</text>
  <text x="475" y="690" class="body">Input / Message</text>
  <rect x="755" y="585" width="280" height="125" class="box" fill="#fff"/>
  <text x="775" y="620" class="body">Plugin 自定义资源（CRD）</text>
  <text x="775" y="658" class="heading">Task / Routine / …</text>
  <text x="775" y="690" class="body">spec：目标 · status：进展</text>
  <text x="455" y="752" class="body">队列 / Watch / 定时唤醒</text>
  <text x="455" y="788" class="small">同一资源串行处理；关联资源的变化映射为主资源请求</text>

  <rect x="1160" y="20" width="300" height="65" class="box" fill="#f1ecf6"/>
  <text x="1310" y="61" text-anchor="middle" class="heading">外部系统 / 环境</text>
  <rect x="1160" y="150" width="300" height="150" class="box" fill="#f1ecf6"/>
  <text x="1185" y="192" class="heading">Connector</text>
  <text x="1185" y="232" class="body">Host 统一装配与访问</text>
  <text x="1185" y="269" class="small">当前：需求 / PR / 环境声明</text>
  <rect x="1160" y="390" width="300" height="125" class="box" fill="#f1ecf6"/>
  <text x="1185" y="432" class="heading">Harness</text>
  <text x="1185" y="474" class="body">Agent 判断与执行事件流</text>
  <rect x="1160" y="610" width="300" height="125" class="box" fill="#f1ecf6"/>
  <text x="1185" y="652" class="heading">ask / confirm</text>
  <text x="1185" y="694" class="body">Host 管理用户交互</text>

  <rect x="1160" y="775" width="300" height="85" class="box" fill="#f1ecf6"/>
  <text x="1180" y="808" class="heading">Agent Tools · 模型选用</text>
  <text x="1180" y="840" class="small">Chief：Work CRUD</text>
  <path d="M1460 455 H1480 V817 H1460" class="flow"/>
  <path d="M1160 825 H1100 V790 H1060" class="flow"/>

  <path d="M190 150 V110 H1130 V200 H1160" class="flow"/>
  <text x="680" y="116" class="label">Source 查询 Connector</text>
  <path d="M1310 150 V85" class="flow" marker-start="url(#arrow)"/>
  <path d="M340 285 H375 V440 H520 V520" class="flow"/>
  <text x="385" y="434" class="label">提交 Input / 建立资源</text>
  <path d="M340 625 H430" class="flow" marker-start="url(#arrow)"/>
  <path d="M660 520 V380" class="flow"/>
  <text x="675" y="476" class="label">资源变化 / Watch</text>
  <path d="M950 380 V520" class="flow"/>
  <text x="966" y="434" class="label">读写资源</text>
  <path d="M1060 260 H1160" class="flow"/>
  <text x="1080" y="248" class="label">API</text>
  <path d="M1060 310 H1125 V450 H1160" class="flow"/>
  <text x="1132" y="438" class="label">verb</text>
  <path d="M1060 350 H1100 V670 H1160" class="flow"/>
  <text x="1114" y="595" class="label">verb</text>

  <text x="40" y="896" class="body">业务闭环：接收变化 → 唤醒资源 → Reconcile 判断与执行 → 保存进展 → 等待下一次变化</text>
  <text x="40" y="931" class="body">动作选择：明确流程由 Reconcile 直接调用；需要上下文判断时，经 Harness 由 Agent 选择并调用工具。</text>
  <text x="40" y="966" class="small">逻辑视图：Plugin 回调运行于 Runner；持久化、调度、Connector、Harness 调用与交互由 Host 管理，二者通过 IPC 通信。</text>
</svg>
